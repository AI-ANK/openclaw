<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenClaw Accountability Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-hover: #1c2129;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --gold: #f0c000;
    --purple: #bc8cff;
    --radius: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; font-weight: 600; }
  header h1 span { color: var(--accent); }

  nav { display: flex; gap: 4px; }
  nav button { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-size: 13px; transition: all 0.15s; }
  nav button:hover { border-color: var(--text-muted); color: var(--text); }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { max-width: 1200px; margin: 0 auto; padding: 24px; }

  .view { display: none; }
  .view.active { display: block; }

  /* Task Board - Kanban */
  .kanban { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .kanban-col { background: var(--surface); border-radius: var(--radius); padding: 12px; }
  .kanban-col h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .kanban-col h3 .count { background: var(--border); padding: 1px 6px; border-radius: 10px; font-size: 11px; }

  .task-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s; }
  .task-card:hover { border-color: var(--accent); }
  .task-card .title { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .task-card .meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 8px; align-items: center; }

  .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
  .badge-critical { background: var(--red); color: #fff; }
  .badge-high { background: #da3633; color: #fff; }
  .badge-medium { background: var(--yellow); color: #000; }
  .badge-low { background: var(--border); color: var(--text-muted); }

  /* Agent Roster */
  .roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .agent-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .agent-card .agent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .agent-card .agent-name { font-size: 16px; font-weight: 600; }
  .agent-card .agent-rank { font-size: 24px; font-weight: 700; color: var(--text-muted); }

  .standing-badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .standing-probation { background: rgba(248, 81, 73, 0.2); color: var(--red); border: 1px solid var(--red); }
  .standing-standard { background: rgba(88, 166, 255, 0.2); color: var(--accent); border: 1px solid var(--accent); }
  .standing-trusted { background: rgba(63, 185, 80, 0.2); color: var(--green); border: 1px solid var(--green); }
  .standing-star { background: rgba(240, 192, 0, 0.2); color: var(--gold); border: 1px solid var(--gold); }

  .score-big { font-size: 32px; font-weight: 700; text-align: center; margin: 8px 0; }
  .score-label { text-align: center; font-size: 12px; color: var(--text-muted); }

  .dimensions { margin-top: 12px; }
  .dim-row { display: flex; align-items: center; margin-bottom: 6px; font-size: 12px; }
  .dim-label { width: 90px; color: var(--text-muted); }
  .dim-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 0 8px; }
  .dim-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .dim-value { width: 32px; text-align: right; font-weight: 500; }

  /* Leaderboard */
  .leaderboard { max-width: 600px; }
  .lb-row { display: flex; align-items: center; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; }
  .lb-rank { font-size: 20px; font-weight: 700; width: 40px; color: var(--text-muted); }
  .lb-rank.rank-1 { color: var(--gold); }
  .lb-rank.rank-2 { color: #c0c0c0; }
  .lb-rank.rank-3 { color: #cd7f32; }
  .lb-info { flex: 1; }
  .lb-name { font-weight: 600; }
  .lb-stats { font-size: 12px; color: var(--text-muted); }
  .lb-score { font-size: 20px; font-weight: 700; }

  /* Add Task Modal */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 480px; max-width: 90vw; max-height: 90vh; overflow-y: auto; }
  .modal h2 { margin-bottom: 16px; font-size: 18px; }
  .modal label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; margin-top: 12px; }
  .modal input, .modal textarea, .modal select { width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; font-family: inherit; }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .modal .actions button { padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; border: 1px solid var(--border); }
  .btn-primary { background: var(--accent); border-color: var(--accent) !important; color: #fff; font-weight: 500; }
  .btn-secondary { background: transparent; color: var(--text-muted); }

  /* Task Detail Modal */
  .task-detail .td-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .task-detail .td-title { font-size: 18px; font-weight: 600; flex: 1; }
  .task-detail .td-section { margin-top: 16px; }
  .task-detail .td-section h4 { font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
  .task-detail .td-section p { font-size: 14px; line-height: 1.5; }
  .task-detail .criteria-item { padding: 4px 0; font-size: 13px; }

  .auto-refresh { font-size: 11px; color: var(--text-muted); }
  .add-btn { background: var(--green); border: none; color: #fff; padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 500; }
</style>
</head>
<body>

<header>
  <h1><span>OpenClaw</span> Accountability Dashboard</h1>
  <nav>
    <button class="active" data-view="board">Task Board</button>
    <button data-view="roster">Agent Roster</button>
    <button data-view="leaderboard">Leaderboard</button>
    <button class="add-btn" id="addTaskBtn">+ Add Task</button>
  </nav>
  <span class="auto-refresh">Auto-refresh: 30s</span>
</header>

<main>
  <div id="board-view" class="view active">
    <div class="kanban" id="kanban"></div>
  </div>

  <div id="roster-view" class="view">
    <div class="roster" id="roster"></div>
  </div>

  <div id="leaderboard-view" class="view">
    <div class="leaderboard" id="leaderboard"></div>
  </div>
</main>

<!-- Add Task Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>Add New Task</h2>
    <label>Title</label>
    <input id="taskTitle" placeholder="e.g. Build user dashboard">
    <label>Description</label>
    <textarea id="taskDesc" placeholder="Describe the task in detail..."></textarea>
    <label>Priority</label>
    <select id="taskPriority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
      <option value="critical">Critical</option>
    </select>
    <label>Acceptance Criteria (one per line)</label>
    <textarea id="taskCriteria" placeholder="Each line becomes a criterion..."></textarea>
    <label>Tags (comma-separated)</label>
    <input id="taskTags" placeholder="e.g. feature, frontend">
    <div class="actions">
      <button class="btn-secondary" id="cancelAdd">Cancel</button>
      <button class="btn-primary" id="submitAdd">Create Task</button>
    </div>
  </div>
</div>

<!-- Task Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal task-detail" id="taskDetail"></div>
</div>

<script>
const API = '/plugins/accountability/api';
let tasks = [];
let scorecards = [];
let leaderboard = [];

// Navigation
document.querySelectorAll('nav button[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button[data-view]').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.view + '-view').classList.add('active');
  });
});

// Fetch data
async function fetchData() {
  try {
    const [tasksRes, scorecardsRes, lbRes] = await Promise.all([
      fetch(API + '/tasks').then(r => r.json()),
      fetch(API + '/scorecards').then(r => r.json()),
      fetch(API + '/leaderboard').then(r => r.json()),
    ]);
    tasks = tasksRes.tasks || [];
    scorecards = scorecardsRes.scorecards || [];
    leaderboard = lbRes.leaderboard || [];
    render();
  } catch (e) {
    console.error('Failed to fetch data:', e);
  }
}

function render() {
  renderKanban();
  renderRoster();
  renderLeaderboard();
}

// Kanban board
function renderKanban() {
  const statuses = ['open', 'claimed', 'in_progress', 'review', 'done', 'blocked'];
  const labels = { open: 'Open', claimed: 'Claimed', in_progress: 'In Progress', review: 'Review', done: 'Done', blocked: 'Blocked' };
  const el = document.getElementById('kanban');

  el.innerHTML = statuses.map(s => {
    const group = tasks.filter(t => t.status === s);
    return `<div class="kanban-col">
      <h3>${labels[s]} <span class="count">${group.length}</span></h3>
      ${group.map(t => `
        <div class="task-card" onclick="showTask('${t.id}')">
          <div class="title">${esc(t.title)}</div>
          <div class="meta">
            <span class="badge badge-${t.priority}">${t.priority}</span>
            ${t.assignedAgent ? `<span>${esc(t.assignedAgent)}</span>` : ''}
            ${t.result?.judgeScore != null ? `<span>${t.result.judgeScore}/100</span>` : ''}
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('');
}

// Agent roster
function renderRoster() {
  const el = document.getElementById('roster');
  if (scorecards.length === 0) {
    el.innerHTML = '<p style="color:var(--text-muted)">No agent scorecards yet. Agents get scorecards after completing their first task.</p>';
    return;
  }

  el.innerHTML = scorecards.map(sc => {
    const rank = leaderboard.find(e => e.agentId === sc.agentId)?.rank || '?';
    return `<div class="agent-card">
      <div class="agent-header">
        <div>
          <div class="agent-name">${esc(sc.agentId)}</div>
          <span class="standing-badge standing-${sc.standing}">${sc.standing}</span>
        </div>
        <div class="agent-rank">#${rank}</div>
      </div>
      <div class="score-big">${sc.overall}</div>
      <div class="score-label">Overall Score / 100</div>
      <div class="dimensions">
        ${dimBar('Completion', sc.dimensions.completion)}
        ${dimBar('Quality', sc.dimensions.quality)}
        ${dimBar('Proactivity', sc.dimensions.proactivity)}
        ${dimBar('Reliability', sc.dimensions.reliability)}
        ${dimBar('Initiative', sc.dimensions.initiative)}
      </div>
      <div style="margin-top:12px;font-size:12px;color:var(--text-muted)">
        ${sc.totalTasksCompleted} tasks completed | ${sc.totalQuestionsAsked} questions asked
      </div>
    </div>`;
  }).join('');
}

function dimBar(label, value) {
  const color = value >= 70 ? 'var(--green)' : value >= 40 ? 'var(--yellow)' : 'var(--red)';
  return `<div class="dim-row">
    <span class="dim-label">${label}</span>
    <div class="dim-bar"><div class="dim-fill" style="width:${value}%;background:${color}"></div></div>
    <span class="dim-value">${value}</span>
  </div>`;
}

// Leaderboard
function renderLeaderboard() {
  const el = document.getElementById('leaderboard');
  if (leaderboard.length === 0) {
    el.innerHTML = '<p style="color:var(--text-muted)">No agents on the leaderboard yet.</p>';
    return;
  }

  el.innerHTML = leaderboard.map(e => {
    const sc = scorecards.find(s => s.agentId === e.agentId);
    const rankClass = e.rank <= 3 ? `rank-${e.rank}` : '';
    return `<div class="lb-row">
      <div class="lb-rank ${rankClass}">#${e.rank}</div>
      <div class="lb-info">
        <div class="lb-name">${esc(e.agentId)}</div>
        <div class="lb-stats">
          <span class="standing-badge standing-${e.standing}" style="font-size:10px;padding:1px 6px">${e.standing}</span>
          ${e.totalTasksCompleted} tasks
        </div>
      </div>
      <div class="lb-score">${e.overall}</div>
    </div>`;
  }).join('');
}

// Task detail modal
function showTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;

  const el = document.getElementById('taskDetail');
  const criteria = (t.acceptanceCriteria || []).map(c => `<div class="criteria-item">- ${esc(c)}</div>`).join('');
  const questions = (t.questions || []).map(q => `<div class="criteria-item"><b>Q:</b> ${esc(q.question)}${q.answer ? `<br><b>A:</b> ${esc(q.answer)}` : ''}</div>`).join('');

  el.innerHTML = `
    <div class="td-header">
      <div class="td-title">${esc(t.title)}</div>
      <span class="badge badge-${t.priority}">${t.priority}</span>
    </div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">
      Status: <b>${t.status}</b> | ID: ${t.id}
      ${t.assignedAgent ? ` | Agent: ${esc(t.assignedAgent)}` : ''}
      ${t.result?.judgeScore != null ? ` | Judge Score: <b>${t.result.judgeScore}/100</b>` : ''}
    </div>
    <div class="td-section">
      <h4>Description</h4>
      <p>${esc(t.description)}</p>
    </div>
    ${criteria ? `<div class="td-section"><h4>Acceptance Criteria</h4>${criteria}</div>` : ''}
    ${t.result ? `<div class="td-section"><h4>Result</h4><p>${esc(t.result.summary || '')}</p>${t.result.judgeRationale ? `<p style="margin-top:8px;color:var(--text-muted)"><b>Judge:</b> ${esc(t.result.judgeRationale)}</p>` : ''}</div>` : ''}
    ${questions ? `<div class="td-section"><h4>Questions</h4>${questions}</div>` : ''}
    <div class="actions"><button class="btn-secondary" onclick="document.getElementById('detailModal').classList.remove('active')">Close</button></div>
  `;
  document.getElementById('detailModal').classList.add('active');
}

// Add task modal
document.getElementById('addTaskBtn').addEventListener('click', () => {
  document.getElementById('addModal').classList.add('active');
});
document.getElementById('cancelAdd').addEventListener('click', () => {
  document.getElementById('addModal').classList.remove('active');
});
document.getElementById('submitAdd').addEventListener('click', async () => {
  const title = document.getElementById('taskTitle').value.trim();
  if (!title) return;

  const criteriaText = document.getElementById('taskCriteria').value.trim();
  const tagsText = document.getElementById('taskTags').value.trim();

  await fetch(API + '/tasks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      title,
      description: document.getElementById('taskDesc').value.trim(),
      priority: document.getElementById('taskPriority').value,
      acceptanceCriteria: criteriaText ? criteriaText.split('\n').filter(Boolean) : undefined,
      tags: tagsText ? tagsText.split(',').map(s => s.trim()).filter(Boolean) : undefined,
    }),
  });

  document.getElementById('addModal').classList.remove('active');
  document.getElementById('taskTitle').value = '';
  document.getElementById('taskDesc').value = '';
  document.getElementById('taskCriteria').value = '';
  document.getElementById('taskTags').value = '';
  fetchData();
});

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('active');
  });
});

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// Initial load + auto-refresh
fetchData();
setInterval(fetchData, 30000);
</script>
</body>
</html>
